version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: smartsort-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartsort
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. NestJS Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: smartsort-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smartsort?schema=public
      - GEMINI_API_KEY=AIzaSyDQ-OxVEOVmb9AY3BwFVbG3pYwEW25ZQK4
      - JWT_SECRET=supersecretkeyformvp
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      - db

  # 3. Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: smartsort-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  postgres_data:
